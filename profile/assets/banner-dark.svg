<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="fshy: a searchable catalogue of free and cheap cloud capacity with evidence">
  <defs>
    <radialGradient id="glowA" cx="0.82" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#4bc58a" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#4bc58a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.12" cy="1.05" r="0.6">
      <stop offset="0" stop-color="#7dd5a2" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#7dd5a2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd5a2"/>
      <stop offset="0.55" stop-color="#4bc58a"/>
      <stop offset="1" stop-color="#137443"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <clipPath id="card"><rect width="1280" height="320" rx="24"/></clipPath>
    <style>
      .t { font-family: ui-sans-serif, -apple-system, "Segoe UI", "Inter", "Helvetica Neue", Arial, sans-serif; }
      .m { font-family: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace; }
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1280" height="320" fill="#0f1712"/>
    <rect width="1280" height="320" fill="url(#dots)"/>
    <rect width="1280" height="320" fill="url(#glowA)"/>
    <rect width="1280" height="320" fill="url(#glowB)"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="319" rx="23.5" fill="none" stroke="#1f2c23"/>

  <g transform="translate(1006 28) scale(0.5)" fill="none" stroke="url(#leaf)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 300 64 C 258 64 220 84 220 128 L 220 408 C 220 448 196 468 164 468 C 128 468 108 444 108 408 L 108 336" stroke-width="44"/>
    <path d="M 108 336 L 142 360" stroke-width="26"/>
    <path d="M 128 224 L 312 224" stroke-width="44"/>
  </g>

  <text class="t" x="88" y="150" font-size="84" font-weight="700" letter-spacing="-3" fill="#e6f2ea">f<tspan fill="url(#leaf)">shy</tspan></text>
  <text class="t" x="92" y="200" font-size="25" font-weight="400" fill="#a9c4b2">A searchable catalogue of free and cheap cloud capacity, with evidence.</text>
  <text class="m" x="93" y="252" font-size="15" letter-spacing="3" fill="#6f9580">FREE  ·  CHEAP  ·  EVIDENCE  ·  SEARCHABLE</text>
</svg>
